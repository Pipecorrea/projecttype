name: CI

on:
  push:
  pull_request:

jobs:
  python:
    name: Tests, ruff, mypy
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create GitHub App token
        id: app-token
        if: ${{ vars.ORG_APP_ID != '' }}
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.ORG_APP_ID }}
          private-key: ${{ secrets.ORG_APP_KEY }}

      - name: Configure git for private sni-commons
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          ECOSYSTEM_PAT: ${{ secrets.ECOSYSTEM_PAT }}
        run: |
          TOKEN="${APP_TOKEN:-${ECOSYSTEM_PAT:-${{ github.token }}}}"
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync dependencies
        run: uv sync --extra dev --locked

      - name: Pytest
        run: uv run pytest

      - name: Ruff
        run: uv run ruff check src scripts tests

      - name: mypy (--strict)
        run: uv run mypy src

      - name: Golden eval gate (PT-10)
        run: uv run python scripts/eval_golden.py --ci